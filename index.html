<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>왁뿌 비누</title>
  <meta name="description" content="비누에 글씨를 쓰고 왁스로 덮어 보내요. 받은 사람이 왁스를 깨면 글씨가 나와요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@700&family=Jua&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 작성 화면 -->
  <main id="compose" class="compose">
    <header class="brand">
      <h1>왁뿌 비누</h1>
      <p>비누에 글씨를 쓰고 왁스로 덮어서 보내요.<br />받은 사람이 왁스를 깨면 글씨가 나와요.</p>
    </header>

    <p id="notice" class="notice" hidden>링크가 잘못됐어요. 새로 만들어 보세요.</p>

    <canvas id="preview" class="preview" width="640" height="440" aria-label="비누 미리보기"></canvas>

    <section class="field">
      <label class="field-title" for="l1">숨길 글씨 <small>두 줄, 줄마다 10자까지</small></label>
      <div class="line"><input id="l1" type="text" maxlength="10" autocomplete="off" placeholder="첫째 줄" /><span id="n1" class="count">0/10</span></div>
      <div class="line"><input id="l2" type="text" maxlength="10" autocomplete="off" placeholder="둘째 줄 (비워도 돼요)" /><span id="n2" class="count">0/10</span></div>
    </section>

    <section class="field">
      <h2 class="field-title">글꼴</h2>
      <div id="fonts" class="chips"></div>
    </section>
    <section class="field">
      <h2 class="field-title">글씨 색</h2>
      <div id="inks" class="swatches"></div>
    </section>
    <section class="field">
      <h2 class="field-title">비누 색</h2>
      <div id="clays" class="swatches"></div>
    </section>
    <section class="field">
      <h2 class="field-title">왁스 색</h2>
      <div id="waxes" class="swatches"></div>
    </section>

    <section class="actions">
      <input id="link" class="link" type="text" readonly aria-label="보낼 링크" />
      <button id="copy" class="primary" disabled>링크 복사하기</button>
      <button id="share" class="secondary" disabled hidden>공유하기</button>
      <button id="try" class="ghost" disabled>내가 먼저 깨 보기</button>
      <p id="toast" class="toast" role="status"></p>
    </section>
  </main>

  <!-- 깨기 화면 -->
  <div id="play" class="play">
    <canvas id="scene"></canvas>
    <p id="hint" class="hint">왁스를 톡톡 눌러 깨 보세요<br /><small>끌면 돌려 볼 수 있어요</small></p>
    <button id="mute" class="mute" aria-label="소리 끄기">🔊</button>
    <div id="loading" class="loading">비누 굳히는 중…</div>
    <div id="done" class="done">
      <p class="done-title">짠!</p>
      <div class="done-buttons">
        <button id="again" class="secondary">다시 깨기</button>
        <button id="make" class="primary">나도 만들기</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
